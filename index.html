<style>

canvas{display:block;width:100%;height:100%}
.hud{position:fixed;color:var(--ink);background:var(--hud);border-radius:14px;padding:8px 14px;font-weight:700}
#score{top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;font-size:1.1rem}
#tip{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;font-size:.75rem;max-width:42vw;font-weight:600}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const scene=new T.Scene();scene.background=new T.Color(0x9fd8ff);scene.fog=new T.Fog(0x9fd8ff,45,130);
const cam=new T.PerspectiveCamera(60,1,.1,200);
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(ren.domElement);
const hemi=new T.HemisphereLight(0xffffff,0x9a7ac0,.95);scene.add(hemi);

const mat=c=>new T.MeshLambertMaterial({color:c});
const box=(w,h,d,c,x,y,z,p)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||scene).add(m);return m};
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return new T.CanvasTexture(c)}

/* ground */
const gt=tex(128,128,g=>{g.fillStyle='#ffd0e8';g.fillRect(0,0,128,128);g.fillStyle='#fff';g.fillRect(0,0,64,64);g.fillRect(64,64,64,64)});
gt.wrapS=gt.wrapT=T.RepeatWrapping;gt.repeat.set(30,30);
const ground=new T.Mesh(new T.PlaneGeometry(120,120),new T.MeshLambertMaterial({map:gt}));ground.rotation.x=-Math.PI/2;scene.add(ground);

/* banner */
const bt=tex(1024,256,(g,w,h)=>{g.fillStyle='#ff4f93';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.textAlign='center';g.font='bold 92px system-ui,sans-serif';g.fillText('HAPPY BIRTHDAY',512,115);g.font='bold 80px system-ui,sans-serif';g.fillStyle='#ffe066';g.fillText('ZHANVERMEER!',512,212)});
const ban=new T.Mesh(new T.PlaneGeometry(18,4.5),new T.MeshBasicMaterial({map:bt,side:T.DoubleSide}));ban.position.set(0,7,-24);scene.add(ban);
box(.5,9,.5,0xffffff,-9.5,4.5,-24);box(.5,9,.5,0xffffff,9.5,4.5,-24);

/* cake with 22 candles */
const cake=new T.Group();cake.position.set(0,0,-14);scene.add(cake);
const cyl=(r,h,c,y)=>{const m=new T.Mesh(new T.CylinderGeometry(r,r,h,32),mat(c));m.position.y=y;cake.add(m)};
cyl(3.4,1.6,0xff7eb6,.8);cyl(2.5,1.2,0xfff0d9,2.2);
for(let i=0;i<22;i++){const a=i/22*Math.PI*2,x=Math.cos(a)*1.8,z=Math.sin(a)*1.8;
  const c=new T.Mesh(new T.CylinderGeometry(.09,.09,.6,8),mat([0x3d8bff,0xffc233,0x2bc48a][i%3]));c.position.set(x,3.2,z);cake.add(c);
  const f=new T.Mesh(new T.SphereGeometry(.12,8,8),new T.MeshBasicMaterial({color:0xffd23f}));f.position.set(x,3.65,z);cake.add(f)}

/* balloons */
const balloons=[];
for(let i=0;i<0;i++){const a=i/16*Math.PI*2,r=24+(i%3)*5,x=Math.cos(a)*r,z=Math.sin(a)*r,y=7+(i%4)*1.5;
  const g=new T.Group();g.position.set(x,y,z);
  const b=new T.Mesh(new T.SphereGeometry(1.1,16,16),mat([0xff4f93,0xffc233,0x2bc48a,0x3d8bff,0x9b5de5][i%5]));b.scale.y=1.25;g.add(b);
  const s=new T.Mesh(new T.CylinderGeometry(.02,.02,y,4),mat(0xffffff));s.position.y=-y/2-1.2;g.add(s);
  scene.add(g);balloons.push(g)}

/* platforms (obby stairs) */
/* stage 1: long hard obby */
const plats=[];let seed=22;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
const pal=[0xff4f93,0xffc233,0x3d8bff,0x9b5de5,0xff7a45,0x2bc48a];let cpN=0;
function addPlat(x,z,w,d,top,mv,cp,col,ph){
  const th=1.2,m=new T.Mesh(new T.BoxGeometry(w,th,d),mat(col));m.position.set(x,top-th/2,z);scene.add(m);
  const q={x,z,w,d,h:top,b:top-th,m,mv,x0:x,z0:z,ddx:0,ddz:0,cp:cp?++cpN:0,ph:ph||0};plats.push(q);
  if(cp){box(.2,3,.2,0xffffff,x+w/2-.5,top+1.5,z+d/2-.5);box(1.2,.8,.1,0xff4f93,x+w/2+.1,top+2.6,z+d/2-.5)}
  return q;
}
addPlat(66,0,10,10,0,null,1,0x2bc48a);
let ox=66,oz=0,oy=0,ow=10;
for(let i=1;i<=48;i++){
  const t=i/48,cp=i%8==0,mv=!cp&&i>6&&rnd()<.22?(rnd()<.5?'x':'z'):null;
  const nw=mv?3.4:Math.max(1.8,4-2.2*t+rnd()*.8),nd=mv?3.4:Math.max(1.8,4-1.8*t+rnd()*.8),W=cp?5:nw,D=cp?5:nd;
  let dy=(rnd()<.6?1:-.4)*(.3+rnd()*.9);if(oy+dy<.8)dy=.7;if(oy+dy>60)dy=-.5;
  const gap=2+1.4*t+rnd()*.7+(dy<0?.5:0)-(dy>0?.4*dy:0),dz=(rnd()-.5)*(2+4*t);
  ox+=ow/2+gap+W/2;oz=clamp(oz+dz,-16,16);oy+=dy;ow=W;
  addPlat(ox,oz,W,D,oy,mv,cp,cp?0x2bc48a:pal[i%6],i);
}
ox+=ow/2+9;
const FIN=addPlat(ox,0,12,12,oy+.5,null,0,0xffc233,0);
box(2.4,2.4,2.4,0xff4f93,ox,oy+1.7,0);box(2.5,.4,2.5,0xffffff,ox,oy+2.9,0);box(.4,2.4,2.5,0xffe066,ox,oy+1.7,0);
const lava=new T.Mesh(new T.PlaneGeometry(1400,260),new T.MeshBasicMaterial({color:0xff6b9a}));lava.rotation.x=-Math.PI/2;lava.position.set(300,-12,0);scene.add(lava);
const st=tex(512,128,(g,w,h)=>{g.fillStyle='#3d8bff';g.fillRect(0,0,w,h);g.fillStyle='#fff';g.textAlign='center';g.font='bold 54px system-ui,sans-serif';g.fillText('STAGE 1: OBBY >>>',256,82)});
const sg2=new T.Mesh(new T.PlaneGeometry(12,3),new T.MeshBasicMaterial({map:st,side:T.DoubleSide}));sg2.position.set(52,8.5,0);sg2.rotation.y=-Math.PI/2;scene.add(sg2);
box(.4,8,.4,0xffffff,52,4,-5.8);box(.4,8,.4,0xffffff,52,4,5.8);

/* stars */
const sh=new T.Shape();for(let i=0;i<10;i++){const r=i%2?.38:.85,a=i*Math.PI/5+Math.PI/2;sh[i?'lineTo':'moveTo'](Math.cos(a)*r,Math.sin(a)*r)}
const sg=new T.ExtrudeGeometry(sh,{depth:.25,bevelEnabled:false});sg.translate(0,0,-.125);
const sm=new T.MeshLambertMaterial({color:0xffd23f,emissive:0xaa7a00});
const stars=[];
const addStar=(x,y,z)=>{const m=new T.Mesh(sg,sm);m.position.set(x,y,z);m.userData.y=y;scene.add(m);stars.push(m)};
const stat=plats.filter(q=>!q.mv&&q!==FIN&&q.h>0);for(let i=0;i<22;i++){const q=stat[Math.floor((i+.5)*stat.length/22)];addStar(q.x,q.h+1.6,q.z)}
let count=0;

/* main area: sunset party plaza */
{const H=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)},C0=-4,col=new T.Color(),D=new T.Object3D();
scene.background=tex(8,256,(g,w,h)=>{const q=g.createLinearGradient(0,0,0,h);q.addColorStop(0,'#5b5fc7');q.addColorStop(.35,'#d96fa8');q.addColorStop(.7,'#ffa26b');q.addColorStop(1,'#ffd9a0');g.fillStyle=q;g.fillRect(0,0,w,h)});
scene.fog=new T.Fog(0xf0a98c,55,175);hemi.color.set(0xffd9b8);hemi.groundColor.set(0x8a6a9a);sun.color.set(0xffa868);sun.position.set(-25,12,20);
const gr=tex(128,128,g=>{g.fillStyle='#86cf84';g.fillRect(0,0,128,128);for(let i=0;i<260;i++){g.fillStyle=i%2?'#9bdc8e':'#74bf74';g.fillRect(H(i)*128,H(i+500)*128,3,3)}});gr.wrapS=gr.wrapT=T.RepeatWrapping;gr.repeat.set(44,36);
ground.geometry=new T.PlaneGeometry(220,180);ground.position.x=-50;ground.material=new T.MeshLambertMaterial({map:gr});
const cb=(rx,ry)=>{const t=tex(128,128,g=>{g.fillStyle='#b9a58f';g.fillRect(0,0,128,128);for(let r=0;r<4;r++)for(let c=0;c<4;c++){g.fillStyle=['#cdb9a2','#c2ae98','#d6c4ad'][(r+c*2)%3];g.fillRect(c*32+(r%2?16:0)+1,r*32+1,30,30)}});t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);return new T.MeshLambertMaterial({map:t})};
const flat=(geo,m,x,y,z)=>{const q=new T.Mesh(geo,m);q.rotation.x=-Math.PI/2;q.position.set(x,y,z);scene.add(q)};
flat(new T.CircleGeometry(24,48),cb(10,10),0,.03,C0);flat(new T.RingGeometry(23.2,24.6,48),new T.MeshBasicMaterial({color:0xffc84a}),0,.05,C0);flat(new T.PlaneGeometry(40,8),cb(8,2),40,.03,0);
/* glowing 22 statue */
const gm=new T.MeshLambertMaterial({color:0xffd23f,emissive:0xff9a1f}),S=new T.Group();S.position.set(0,0,C0);scene.add(S);
const sb=new T.Mesh(new T.CylinderGeometry(5,5.6,1,24),mat(0xe9dcc8));sb.position.y=.5;S.add(sb);
const seg=(x,y,w,h)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,1),gm);m.position.set(x,1+y,0);S.add(m)};
{const t22=(f,c)=>tex(1024,512,g=>{g.font='bold 430px "Arial Black",Impact,system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=36;g.strokeStyle=f?'#fff6c8':c;g.strokeText('22',512,270);g.fillStyle=f?'#ffc21f':c;g.fillText('22',512,270)}),face=(tx,z,ry)=>{const m=new T.Mesh(new T.PlaneGeometry(13,6.5),new T.MeshBasicMaterial({map:tx,transparent:true,alphaTest:.35}));m.position.set(0,4.6,z);m.rotation.y=ry;S.add(m)};
face(t22(1),.5,0);face(t22(1),-.5,Math.PI);const dk=t22(0,'#b8780f');for(let k=-3;k<=3;k++)face(dk,k*.14,0)}
const gl=new T.PointLight(0xffb050,1.3,30);gl.position.set(0,5,C0+3);scene.add(gl);
/* path lanterns */
const lm=new T.MeshBasicMaterial({color:0xffe08a});
for(let i=0;i<6;i++)[-4.6,4.6].forEach(z=>{const x=26+i*5.5;box(.2,3,.2,0x4a3a4a,x,1.5,z);const l=new T.Mesh(new T.SphereGeometry(.45,8,8),lm);l.position.set(x,3.3,z);scene.add(l)});
/* string lights */
const P=[];for(let i=1;i<9;i++){const a=(i+.5)/10*Math.PI*2,x=Math.cos(a)*22,z=C0+Math.sin(a)*22;box(.25,6,.25,0x4a3a4a,x,3,z);P.push([x,z])}
const bg=new T.SphereGeometry(.17,6,6),bm=[0xffd23f,0xff7eb6,0x7fe0ff,0xb6ff8a].map(c=>new T.MeshBasicMaterial({color:c}));
for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];for(let k=1;k<9;k++){const u=k/9,m=new T.Mesh(bg,bm[(i+k)%4]);m.position.set(a[0]+(b[0]-a[0])*u,6-Math.sin(u*Math.PI)*1.1,a[1]+(b[1]-a[1])*u);scene.add(m)}}
/* confetti */
const N=450,cp=new Float32Array(N*3),cc=new Float32Array(N*3);
for(let i=0;i<N;i++){cp.set([-140+H(i)*190,H(i+9)*30,-80+H(i+17)*160],i*3);col.set([0xff4f93,0xffc233,0x3d8bff,0x2bc48a,0xffffff][i%5]);cc.set([col.r,col.g,col.b],i*3)}
const cg=new T.BufferGeometry();cg.setAttribute('position',new T.BufferAttribute(cp,3));cg.setAttribute('color',new T.BufferAttribute(cc,3));
const cf=new T.Points(cg,new T.PointsMaterial({size:.5,vertexColors:true}));cf.frustumCulled=false;scene.add(cf);
(function fall(){const n=performance.now()/900;for(let i=0;i<N;i++){cp[i*3+1]-=.04;if(cp[i*3+1]<0)cp[i*3+1]=30;cp[i*3]+=Math.sin(n+i)*.01}cg.attributes.position.needsUpdate=true;requestAnimationFrame(fall)})();
/* floating lanterns and 22 balloons */
for(let i=0;i<12;i++){const a=H(i+40)*6.283,r=26+H(i+70)*40,g=new T.Group();g.position.set(Math.cos(a)*r*1.3-30,10+H(i+90)*10,Math.sin(a)*r*.9);
  const l=new T.Mesh(new T.SphereGeometry(.9,10,8),new T.MeshBasicMaterial({color:[0xffb347,0xff8fb1,0xffe08a][i%3]}));l.scale.y=1.3;g.add(l);scene.add(g);balloons.push(g)}
const bc=['#ff4f93','#ffc233','#3d8bff','#2bc48a','#9b5de5'],b22=bc.map(c=>new T.MeshLambertMaterial({map:tex(512,256,g=>{g.fillStyle=c;g.fillRect(0,0,512,256);g.font='bold 110px system-ui,sans-serif';g.textAlign='center';g.fillStyle='#fff';g.strokeStyle='rgba(40,10,60,.55)';g.lineWidth=10;[128,384].forEach(x=>{g.strokeText('22',x,160);g.fillText('22',x,160)})})}));
for(let i=0;i<9;i++){const a=i/9*6.283+.3,r=30+(i%3)*8,y=9+(i%3)*1.5,g=new T.Group();g.position.set(Math.cos(a)*r,y,C0+Math.sin(a)*r);
  const b=new T.Mesh(new T.SphereGeometry(1.5,16,14),b22[i%5]);b.scale.y=1.2;g.add(b);
